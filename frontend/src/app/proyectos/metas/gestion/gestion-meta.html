<p-dialog [header]="header()" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }" [visible]="visible()"
    (onHide)="cerrarDialog()">

    <form [formGroup]="form">
        <div id="contenedor-formulario">

            <input pInputText type="text" id="nombre" placeholder="Nombre de la meta" formControlName="nombre" />

            @if (metaSeleccionada()) {
            <p-select id="estado" formControlName="estado" [options]="estados()" placeholder="Estado" appendTo="body" />
            }

        </div>
    </form>

    <button pButton id="guardar-meta" label="Guardar" (click)="guardarMeta()"></button>

</p-dialog>
