<app-template>
  <p-button
    id="boton-crear-proyecto"
    icon="pi pi-plus"
    label="Crear Proyecto"
    (click)="crearProyecto()"
  ></p-button>

  <span style="margin-left: 0.5rem; display: inline-block">
    <p-button
      id="boton-exportar-proyectos"
      icon="pi pi-download"
      label="Exportar CSV"
      (click)="exportarCsv()"
    ></p-button>
  </span>

  <span style="margin-left: 0.5rem; display: inline-block">
    <p-button
      id="boton-estadisticas"
      icon="pi pi-chart-bar"
      label="Ver Estadísticas"
      (click)="abrirEstadisticas()"
    ></p-button>
  </span>

  <p-table
    id="tabla"
    [value]="proyectos()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [scrollable]="true"
    scrollHeight="70vh"
  >
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Cliente</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-proyecto>
      <tr>
        <td>{{ proyecto.nombre }}</td>
        <td>{{ proyecto.cliente ? proyecto.cliente.nombre : '' }}</td>
        <td>{{ proyecto.estado }}</td>
        <td>
          <div style="display: flex; gap: 0.5rem; align-items: center">
            <p-button
              id="boton-gestionar-tareas"
              icon="pi pi-list"
              pTooltip="Gestionar Tareas"
              (click)="gestionarTareas(proyecto)"
            ></p-button>
            <p-button
              id="boton-gestionar-metas"
              icon="pi pi-flag"
              pTooltip="Gestionar Metas"
              (click)="gestionarMetas(proyecto)"
            ></p-button>
            <p-button
              icon="pi pi-pencil"
              pTooltip="Editar Proyecto"
              (click)="editarProyecto(proyecto)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No se encontraron proyectos.</td>
      </tr>
    </ng-template>
  </p-table>
</app-template>

<app-estadisticas [(visible)]="estadisticasVisible"></app-estadisticas>

<app-gestion-proyecto
  [(visible)]="dialogVisible"
  [(proyectoSeleccionado)]="proyectoSeleccionado"
></app-gestion-proyecto>

<app-metas-listado
  [(visible)]="dialogMetasVisible"
  [idProyecto]="proyectoSeleccionadoId()"
  [proyectoEstado]="proyectoSeleccionadoEstado()"
></app-metas-listado>
